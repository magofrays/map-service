version: '3.8'

services:
  arangodb:
    image: arangodb:3.11.8
    container_name: arangodb
    environment:
      ARANGO_ROOT_PASSWORD: root
    ports:
      - "8529:8529"
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps:/var/lib/arangodb3-apps

    healthcheck:
      test: ["CMD", "arangosh", "--server.authentication=false", "--query", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  map-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: map-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ARANGO_HOST: arangodb
      ARANGO_PORT: 8529
      ARANGO_USER: root
      ARANGO_PASS: root
      ARANGO_DB: map-db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_REQUEST_QUEUE: map-request
      RABBITMQ_RESPONSE_QUEUE: map-response
      OSM_FILE: /app/map/northwestern-fed-district-260424.osm.pbf
      GRAPH_LOCATION: /app/graph-cache
      SERVER_PORT: 8084
      JWT_PUBLIC_KEY_PATH: classpath:certs/public.pem
      LOG_LEVEL_SECURITY: DEBUG
      LOG_LEVEL_APP: DEBUG
      JPA_SHOW_SQL: true
    volumes:
      - graph-cache:/app/graph-cache
      - ./src/main/resources/map:/app/map:ro
    depends_on:
      - arangodb


volumes:
  arangodb_data:
  arangodb_apps:
  rabbitmq_data:
  graph-cache:

